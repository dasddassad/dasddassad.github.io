short_bio: >-
  <p>I am a Ph.D. student in Computer Science at George Mason University, advised by
  <a href="https://people.cs.gmu.edu/~fangyiyu/">Fang-Yi Yu</a>.</p>
  <p>My research focuses on mechanisms for eliciting reliable information from strategic
  agents. I work on strategic auditing, peer prediction with cheap signals, and truthful
  data procurement, combining theoretical analysis with computational experiments.</p>

