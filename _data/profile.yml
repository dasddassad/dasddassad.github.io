short_bio: >-
  <p>I am a Ph.D. candidate in Computer Science at George Mason University, advised by
  <a href="https://people.cs.gmu.edu/~fangyiyu/">Fang-Yi Yu</a>. My research sits at the
  intersection of algorithmic game theory and machine learning.</p>
  <p>I study how to elicit reliable information from strategic agents. My current interests
  include audit design, peer prediction, multi-agent learning, and data markets.</p>

