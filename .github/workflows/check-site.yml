name: Check academic homepage

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ruby/setup-ruby@v1.327.0
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Build the website
        run: bundle exec jekyll build --destination _site
      - name: Install the preview browser
        run: |
          npm install --prefix "$RUNNER_TEMP/site-browser" playwright@1.63.0
          "$RUNNER_TEMP/site-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Check desktop and mobile layouts
        run: node .github/scripts/check-site.cjs
        env:
          NODE_PATH: ${{ runner.temp }}/site-browser/node_modules
      - name: Save layout previews
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: academic-homepage-layout-checks
          path: _preview_checks/
          if-no-files-found: ignore
          retention-days: 7
      - name: Save the private preview
        uses: actions/upload-artifact@v7.0.1
        with:
          name: academic-homepage-preview
          path: _site/
          retention-days: 7
